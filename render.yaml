services:
  - type: web
    name: sao-khue-web
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm install && PORT=10000 BASE_PATH=/ pnpm --filter @workspace/sao-khue run build && pnpm --filter @workspace/api-server run build
    preDeployCommand: pnpm --filter @workspace/db run push && pnpm --filter @workspace/api-server run seed-posts
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: media
      - key: SITE_URL
        value: https://kientrucsaokhue.com
      - key: CORS_ORIGINS
        value: https://kientrucsaokhue.com,https://www.kientrucsaokhue.com
      - key: BASE_PATH
        value: /
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USER_IDS
        value: render-admin
      - key: REPL_ID
        sync: false
